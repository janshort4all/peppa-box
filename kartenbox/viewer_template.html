<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peppa Box Kartenbox 3D</title>
<style>
  html,body{margin:0;height:100%;background:#f5f0e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#3b2a1c;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  #top{position:fixed;top:10px;left:12px;right:12px;font-size:13px;line-height:1.35;pointer-events:none}
  #top b{font-size:15px}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(245,240,232,.94);
      display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;border-top:1px solid #e3d8c6}
  label{display:flex;gap:8px;align-items:center}
  input[type=range]{width:min(52vw,240px);accent-color:#e9772b}
  button{padding:8px 12px;border-radius:10px;border:1px solid #d6c4a8;background:#fff;color:#3b2a1c;font-size:14px}
  button.on{background:#e9772b;color:#fff;border-color:#e9772b}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><b>Kartenbox für 30 Peppa-Karten</b><br>@MASS@ · Basis/Deckel orange, Inlay beige · ziehen = drehen, zwei Finger = zoomen</div>
<div id="load">3D-Modell wird geladen …</div>
<div id="ui">
  <label>Deckel <input id="a" type="range" min="0" max="@STOP@" value="70"> <span id="av">70°</span></label>
  <button id="bk" class="on">Karten</button>
  <button id="bi" class="on">Inlay</button>
  <button id="bs">Schnitt</button>
  <button id="bv">Ansicht</button>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const YH=@YH@, ZH=@ZH@, H=@H@;
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.localClippingEnabled=true;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
const S=new THREE.Scene(); S.background=new THREE.Color(0xf5f0e8);
const cam=new THREE.PerspectiveCamera(32,1,1,5000);
const ctl=new OrbitControls(cam,cv); ctl.enableDamping=true;
const views=[[260,230,330],[-60,260,420],[420,90,0],[-300,220,-330]];
let vi=0; function setView(i){const v=views[i];cam.position.set(v[0],v[1],v[2]);ctl.target.set(0,55,0);ctl.update();}
setView(0);
S.add(new THREE.HemisphereLight(0xffffff,0xc8b39a,1.2));
const d1=new THREE.DirectionalLight(0xffffff,1.6); d1.position.set(250,420,300); S.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.5); d2.position.set(-300,200,-250); S.add(d2);
const ground=new THREE.Mesh(new THREE.CircleGeometry(600,64),new THREE.MeshStandardMaterial({color:0xebe2d3,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.2; S.add(ground);
const clip=new THREE.Plane(new THREE.Vector3(1,0,0),40);
const pivot=new THREE.Group(); pivot.position.set(0,ZH,-YH); S.add(pivot);
const P={};
const bin=Uint8Array.from(atob("@GLB@"),c=>c.charCodeAt(0));
new GLTFLoader().parse(bin.buffer,'',g=>{
  const names=['basis','deckel','inlay','stift','karten'];
  g.scene.traverse(o=>{ if(o.isMesh){ let n=o.name; let p=o; while(p&&!names.includes(n)){p=p.parent;n=p?p.name:'';}
     const m=o.material; m.side=THREE.DoubleSide; m.clippingPlanes=[]; m.roughness=n==='karten'?0.7:0.55;
     o.userData.part=n; } });
  for(const n of names){ let f=null; g.scene.traverse(o=>{if(!f&&o.name===n)f=o}); if(f) P[n]=f; }
  const all=[]; g.scene.traverse(o=>{if(o.isMesh) all.push(o)});
  for(const o of all){ const n=o.userData.part; const wp=new THREE.Vector3(); o.getWorldPosition(wp);
     const q=new THREE.Quaternion(); o.getWorldQuaternion(q); const sc=new THREE.Vector3(); o.getWorldScale(sc);
     o.parent.remove(o); o.position.copy(wp); o.quaternion.copy(q); o.scale.copy(sc);
     if(n==='deckel'){ o.position.sub(pivot.position); pivot.add(o);} else S.add(o);
     (P['_'+n]=P['_'+n]||[]).push(o); }
  document.getElementById('load').remove(); setAngle(70);
},e=>{document.getElementById('load').textContent='Laden fehlgeschlagen: '+e;});
function setAngle(a){ pivot.rotation.x=-a*Math.PI/180; document.getElementById('av').textContent=a+'°'; }
document.getElementById('a').addEventListener('input',e=>setAngle(+e.target.value));
function tog(id,part){ const b=document.getElementById(id); b.addEventListener('click',()=>{b.classList.toggle('on');
  for(const o of (P['_'+part]||[])) o.visible=b.classList.contains('on');}); }
tog('bk','karten'); tog('bi','inlay');
document.getElementById('bs').addEventListener('click',e=>{const b=e.target; b.classList.toggle('on'); const on=b.classList.contains('on');
  S.traverse(o=>{ if(o.isMesh&&o!==ground) o.material.clippingPlanes=on?[clip]:[]; });
  if(on){cam.position.set(-430,90,0);ctl.target.set(0,60,0);ctl.update();} });
document.getElementById('bv').addEventListener('click',()=>{vi=(vi+1)%views.length;setView(vi);});
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size); size();
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(S,cam);})();
</script>
</body>
</html>
